
services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env.development.db
    restart: unless-stopped
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  back:
    # TODO — backend (NestJS):
    image: ${DOCKERHUB_USERNAME}/todo-back:${APP_VERSION}
    env_file:
      - .env.development.back
    restart: unless-stopped
    ports:
      - "13000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app-config:/app/config:ro

  front:
    image: ${DOCKERHUB_USERNAME}/todo-front:${APP_VERSION}
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      back:
        condition:  service_started

volumes:
  pgdata:


